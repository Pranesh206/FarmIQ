name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_farmiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest  # Ensure installed
    
    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_farmiq
      run: pytest test_backend.py test_data.py -v  # [DEPLOY] Run backend/data tests
    
    - name: Lint code
      uses: pre-commit/action@v3  # Optional: Add pre-commit for linting

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Only on main push
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: docker build -t farmiq:latest .
    
    - name: Test Docker image
      run: docker run --rm farmiq:latest python -c "import app; print('Docker OK')"
    
    - name: Login to Docker Hub  # Optional: Push to registry
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Push to Docker Hub
      run: |
        docker tag farmiq:latest yourusername/farmiq:latest
        docker push yourusername/farmiq:latest

  deploy-heroku:
    needs: [test, build-docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Heroku
      uses: akhileshns/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: "farmiq-hackathon"  # Your app name
        heroku_email: "your-email@example.com"
        appdir: "/"