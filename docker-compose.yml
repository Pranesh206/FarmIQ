version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://user:pass@db:5432/farmiq  # [DEPLOY] For prod DB
    depends_on:
      - db
    volumes:
      - .:/app  # For dev hot-reload

  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=farmiq
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Local access

volumes:
  postgres_data: